name: release

# Publishes a pushed v<version> tag: npm (trusted publishing), the official MCP Registry
# (GitHub OIDC, namespace io.github.LienDeadline) and .mcpb bundles on the GitHub Release.
# Every step is skipped when its target already has this version, so a failed run can be
# re-run safely. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing and MCP Registry login
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use npm with trusted publishing support
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Check the tag matches every manifest
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const read = f => JSON.parse(fs.readFileSync(f, "utf8"));
            const versions = {
              "package.json": read("package.json").version,
              "server.json": read("server.json").version,
              "manifest.json": read("manifest.json").version,
            };
            for (const [file, version] of Object.entries(versions)) {
              if (version !== tag) throw new Error(`${file} is ${version}, tag is ${tag}`);
            }'

      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "liendeadline-mcp@${version}" version >/dev/null 2>&1; then
            echo "liendeadline-mcp@${version} is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Wait until npm serves the version with its mcpName
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if [ "$(npm view "liendeadline-mcp@${version}" mcpName 2>/dev/null)" = "io.github.LienDeadline/liendeadline-mcp" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "npm does not serve liendeadline-mcp@${version} with the expected mcpName." >&2
          exit 1

      - name: Publish to the MCP Registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.LienDeadline%2Fliendeadline-mcp/versions/${version}")
          if [ "$status" = "200" ]; then
            echo "Registry already lists ${version}; skipping publish."
            exit 0
          fi
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

      - name: Build .mcpb bundles
        run: node scripts/pack-mcpb.mjs build

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/*.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
