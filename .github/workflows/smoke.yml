name: smoke

# Compile and test the customer-key contract against mocked HTTP.
# Never issue customer calculations or need credentials in pull-request CI.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Verify credential isolation and denial handling without network access
        run: npm test
