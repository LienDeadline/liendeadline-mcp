steps:
  - name: node:22-alpine
    id: checks
    entrypoint: sh
    args: ["-ec", "npm ci --ignore-scripts && npm run build && npm run typecheck && npm test"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "http", "--tag", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
